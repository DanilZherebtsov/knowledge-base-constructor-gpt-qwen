# Конфигурация проекта для Codex.
#
# project_doc_max_bytes — бюджет на ВСЮ склейку инструкций: глобальный
# ~/.codex/AGENTS.md человека + корневой AGENTS.md проекта + вложенные.
# По умолчанию 32 KiB, и при превышении Codex перестаёт добавлять файлы
# МОЛЧА: ни ошибки, ни записи в лог, ни отметки в интерфейсе. Собранный
# проект весит около 31 KB — то есть по умолчанию помещается впритык, и
# любой непустой глобальный AGENTS.md человека срежет хвост наших правил.
#
# Поэтому лимит поднят. ВАЖНО: в документации этот ключ описан для
# ~/.codex/config.toml; действует ли он на уровне репозитория — НЕ ПРОВЕРЕНО.
# Если после сборки часть правил не применяется, человеку нужно один раз
# прописать ту же строку в своём ~/.codex/config.toml. См. PLATFORM-NOTES.md.
project_doc_max_bytes = 262144
